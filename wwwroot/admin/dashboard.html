<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SuperAdmin Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        /* ── Navbar ── */
        .navbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 0 2rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .nav-brand-icon {
            width: 28px;
            height: 28px;
            background: rgba(56,189,248,0.15);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #38bdf8;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-email {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 6px;
            padding: 0.35rem 0.85rem;
            font-size: 0.78rem;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

            .btn-logout:hover {
                border-color: #f87171;
                color: #f87171;
            }

        /* ── Tabs ── */
        .tabs {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 0 2rem;
            display: flex;
            gap: 0;
        }

        .tab-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: #94a3b8;
            padding: 0.85rem 1.25rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }

            .tab-btn:hover {
                color: #f1f5f9;
            }

            .tab-btn.active {
                color: #38bdf8;
                border-bottom-color: #38bdf8;
            }

        /* ── Layout ── */
        .container {
            padding: 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ── Section header ── */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1.1rem;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

            .btn-primary:hover {
                background: #7dd3fc;
            }

        .btn-secondary {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 8px;
            padding: 0.5rem 1.1rem;
            font-size: 0.82rem;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

            .btn-secondary:hover {
                border-color: #94a3b8;
                color: #f1f5f9;
            }

        /* ── Card ── */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
        }

        /* ── Table ── */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        thead th {
            text-align: left;
            padding: 0.85rem 1.25rem;
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            border-bottom: 1px solid #334155;
        }

        tbody td {
            padding: 0.9rem 1.25rem;
            border-bottom: 1px solid #1e293b;
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.02);
        }

        .user-name {
            font-weight: 500;
            font-size: 0.88rem;
        }

        .user-email {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2px;
        }

        .status-active {
            color: #34d399;
            font-size: 0.75rem;
        }

        .status-inactive {
            color: #f87171;
            font-size: 0.75rem;
        }

        .btn-danger {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 6px;
            padding: 0.3rem 0.7rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

            .btn-danger:hover {
                border-color: #f87171;
                color: #f87171;
            }

        /* ── Empty / loading states ── */
        .state-row td {
            text-align: center;
            padding: 3rem;
            color: #475569;
            font-size: 0.85rem;
        }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 420px;
        }

            .modal h2 {
                font-size: 1rem;
                font-weight: 600;
                margin-bottom: 1.5rem;
            }

        .modal-error {
            display: none;
            background: rgba(248,113,113,0.1);
            border: 1px solid rgba(248,113,113,0.3);
            color: #f87171;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            font-size: 0.78rem;
            margin-bottom: 1rem;
        }

        .field {
            margin-bottom: 1rem;
        }

            .field label {
                display: block;
                font-size: 0.75rem;
                color: #94a3b8;
                margin-bottom: 0.35rem;
            }

            .field input,
            .field select {
                width: 100%;
                background: #0f172a;
                border: 1px solid #334155;
                color: #f1f5f9;
                border-radius: 8px;
                padding: 0.55rem 0.8rem;
                font-size: 0.875rem;
            }

                .field input:focus,
                .field select:focus {
                    outline: none;
                    border-color: #38bdf8;
                }

                .field select option {
                    background: #1e293b;
                }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }

        /* ── Audit log ── */
        .audit-action {
            font-size: 0.72rem;
            font-weight: 500;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            background: rgba(56,189,248,0.1);
            color: #38bdf8;
        }

        /* ── Tab panels ── */
        .tab-panel {
            display: none;
        }

            .tab-panel.active {
                display: block;
            }

        /* ── Pagination ── */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            padding: 1rem 1.25rem;
            border-top: 1px solid #334155;
            font-size: 0.78rem;
            color: #64748b;
        }

        .page-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 6px;
            padding: 0.25rem 0.6rem;
            font-size: 0.75rem;
            cursor: pointer;
        }

            .page-btn:hover {
                border-color: #38bdf8;
                color: #38bdf8;
            }

            .page-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
    </style>
</head>
<body>

    <!-- shared.js must load before the guard runs -->
    <script src="/js/shared.js"></script>
    <script>
    // GUARD — redirects to login if no valid SuperAdmin token
    if (!PortalUtils.requireRole('SuperAdmin')) {
        throw new Error('Redirecting to login');
    }
    </script>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <div class="nav-brand-icon">&#9632;</div>
            Vehicle Portal — SuperAdmin
        </div>
        <div class="nav-right">
            <span id="nav-email" class="nav-email"></span>
            <button class="btn-logout" onclick="PortalUtils.logout()">Sign out</button>
        </div>
    </nav>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('users')">Users</button>
        <button class="tab-btn" onclick="switchTab('audit')">Audit trail</button>
    </div>

    <!-- Main -->
    <div class="container">

        <!-- ── Users tab ── -->
        <div id="tab-users" class="tab-panel active">
            <div class="section-header">
                <span class="section-title">User management</span>
                <div style="display:flex; gap:0.5rem;">
                    <button class="btn-secondary" onclick="loadUsers()">Refresh</button>
                    <button class="btn-primary" onclick="openCreateModal()">+ New user</button>
                </div>
            </div>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th style="text-align:right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr class="state-row"><td colspan="5">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ── Audit tab ── -->
        <div id="tab-audit" class="tab-panel">
            <div class="section-header">
                <span class="section-title">Audit trail</span>
                <button class="btn-secondary" onclick="loadAudit()">Refresh</button>
            </div>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>When</th>
                            <th>Who</th>
                            <th>Action</th>
                            <th>Entity</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="audit-tbody">
                        <tr class="state-row"><td colspan="5">Select the Audit trail tab to load.</td></tr>
                    </tbody>
                </table>
                <div class="pagination">
                    <span id="audit-info"></span>
                    <button class="page-btn" id="audit-prev" onclick="auditPage(-1)">&#8592;</button>
                    <button class="page-btn" id="audit-next" onclick="auditPage(1)">&#8594;</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Create user modal -->
    <div id="create-modal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h2>Create new user</h2>
            <div id="modal-error" class="modal-error"></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
                <div class="field">
                    <label>First name</label>
                    <input id="m-firstname" placeholder="Jane">
                </div>
                <div class="field">
                    <label>Last name</label>
                    <input id="m-lastname" placeholder="Doe">
                </div>
            </div>
            <div class="field">
                <label>Email</label>
                <input id="m-email" type="email" placeholder="jane@vehicleportal.com">
            </div>
            <div class="field">
                <label>Password</label>
                <input id="m-password" type="password" placeholder="Min 8 chars, 1 upper, 1 symbol">
            </div>
            <div class="field">
                <label>Role</label>
                <select id="m-role">
                    <option value="SuperAdmin">SuperAdmin</option>
                    <option value="Seller">Seller</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
                <button class="btn-primary" onclick="createUser()">Create user</button>
            </div>
        </div>
    </div>

    <script>
    // ── Init ──────────────────────────────────────────────────────────────────
    const user = PortalUtils.getUser();
    document.getElementById('nav-email').textContent = user?.email ?? '';
    loadUsers();

    // ── Tab switching ─────────────────────────────────────────────────────────
    function switchTab(name) {
        document.querySelectorAll('.tab-btn').forEach((b, i) => {
            b.classList.toggle('active', ['users','audit'][i] === name);
        });
        document.querySelectorAll('.tab-panel').forEach(p => {
            p.classList.toggle('active', p.id === `tab-${name}`);
        });
        if (name === 'audit' && auditCurrentPage === 0) loadAudit();
    }

    // ── Load users ────────────────────────────────────────────────────────────
    async function loadUsers() {
        const tbody = document.getElementById('users-tbody');
        tbody.innerHTML = '<tr class="state-row"><td colspan="5">Loading…</td></tr>';

        const res = await PortalUtils.apiFetch('/api/admin/users');
        if (!res) return;

        if (!res.ok) {
            tbody.innerHTML = `<tr class="state-row"><td colspan="5">
                Error ${res.status} — could not load users.</td></tr>`;
            return;
        }

        const users = await res.json();
        if (!users.length) {
            tbody.innerHTML = '<tr class="state-row"><td colspan="5">No users found.</td></tr>';
            return;
        }

        tbody.innerHTML = users.map(u => `
            <tr>
                <td>
                    <div class="user-name">${PortalUtils.esc(u.firstName)} ${PortalUtils.esc(u.lastName)}</div>
                    <div class="user-email">${PortalUtils.esc(u.email)}</div>
                </td>
                <td>${(u.roles || []).map(r => PortalUtils.roleBadge(r)).join(' ')}</td>
                <td>
                    ${u.isActive
                        ? '<span class="status-active">&#9679; Active</span>'
                        : '<span class="status-inactive">&#9679; Deactivated</span>'}
                </td>
                <td style="color:#64748b; font-size:0.78rem;">
                    ${PortalUtils.formatDate(u.createdAt)}
                </td>
                <td style="text-align:right;">
                    ${u.isActive ? `
                    <button class="btn-danger"
                            onclick="deactivateUser('${PortalUtils.esc(u.id)}',
                                                    '${PortalUtils.esc(u.email)}')">
                        Deactivate
                    </button>` : '<span style="color:#475569;font-size:0.75rem;">—</span>'}
                </td>
            </tr>
        `).join('');
    }

    // ── Create user ───────────────────────────────────────────────────────────
    function openCreateModal() {
        document.getElementById('create-modal').style.display = 'flex';
        clearModalError();
    }

    function closeCreateModal() {
        document.getElementById('create-modal').style.display = 'none';
        ['m-firstname','m-lastname','m-email','m-password'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('m-role').value = 'SuperAdmin';
        clearModalError();
    }

    function showModalError(msg) {
        const el = document.getElementById('modal-error');
        el.textContent   = msg;
        el.style.display = 'block';
    }

    function clearModalError() {
        const el = document.getElementById('modal-error');
        el.style.display = 'none';
        el.textContent   = '';
    }

    async function createUser() {
        clearModalError();

        const body = {
            firstName: document.getElementById('m-firstname').value.trim(),
            lastName:  document.getElementById('m-lastname').value.trim(),
            email:     document.getElementById('m-email').value.trim(),
            password:  document.getElementById('m-password').value,
            role:      document.getElementById('m-role').value
        };

        if (!body.email || !body.password) {
            showModalError('Email and password are required.');
            return;
        }

        const res = await PortalUtils.apiFetch('/api/admin/users', {
            method: 'POST',
            body:   JSON.stringify(body)
        });

        if (!res) return;

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            showModalError(err.message || 'Failed to create user.');
            return;
        }

        closeCreateModal();
        PortalUtils.toast('User created successfully.', 'success');
        loadUsers();
    }

    // ── Deactivate user ───────────────────────────────────────────────────────
    async function deactivateUser(id, email) {
        if (!confirm(`Deactivate ${email}?\n\nThey will no longer be able to log in.`)) return;

        const res = await PortalUtils.apiFetch(`/api/admin/users/${id}`, {
            method: 'DELETE'
        });

        if (!res) return;

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            PortalUtils.toast(err.message || 'Failed to deactivate user.', 'error');
            return;
        }

        PortalUtils.toast('User deactivated.', 'success');
        loadUsers();
    }

    // ── Audit trail ───────────────────────────────────────────────────────────
    let auditCurrentPage = 0;
    const AUDIT_PAGE_SIZE = 20;

    async function loadAudit(page = 1) {
        const tbody = document.getElementById('audit-tbody');
        tbody.innerHTML = '<tr class="state-row"><td colspan="5">Loading…</td></tr>';

        const res = await PortalUtils.apiFetch(
            `/api/admin/audit?page=${page}&pageSize=${AUDIT_PAGE_SIZE}`
        );

        if (!res) return;

        if (!res.ok) {
            tbody.innerHTML = `<tr class="state-row"><td colspan="5">
                Error ${res.status} — could not load audit logs.</td></tr>`;
            return;
        }

        const data = await res.json();
        auditCurrentPage = page;

        document.getElementById('audit-info').textContent =
            `Page ${page} of ${data.totalPages} (${data.total} entries)`;

        document.getElementById('audit-prev').disabled = page <= 1;
        document.getElementById('audit-next').disabled = page >= data.totalPages;

        if (!data.logs.length) {
            tbody.innerHTML = '<tr class="state-row"><td colspan="5">No audit logs yet.</td></tr>';
            return;
        }

        tbody.innerHTML = data.logs.map(log => `
            <tr>
                <td style="color:#64748b; font-size:0.78rem; white-space:nowrap;">
                    ${PortalUtils.formatDate(log.createdAt)}
                </td>
                <td>
                    <div style="font-size:0.82rem;">${PortalUtils.esc(log.userEmail)}</div>
                    <div style="font-size:0.72rem; color:#64748b;">${PortalUtils.esc(log.userRole)}</div>
                </td>
                <td><span class="audit-action">${PortalUtils.esc(log.action)}</span></td>
                <td style="font-size:0.78rem; color:#94a3b8;">
                    ${PortalUtils.esc(log.entityType)} ${PortalUtils.esc(log.entityId?.slice(0,8))}…
                </td>
                <td style="font-size:0.78rem; color:#94a3b8; max-width:200px; overflow:hidden;
                            text-overflow:ellipsis; white-space:nowrap;">
                    ${PortalUtils.esc(log.details || '—')}
                </td>
            </tr>
        `).join('');
    }

    function auditPage(direction) {
        loadAudit(auditCurrentPage + direction);
    }
    </script>
</body>
</html>
