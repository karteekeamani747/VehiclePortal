<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Vehicle Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
            padding: 1rem;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2.5rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: rgba(167,139,250,0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #a78bfa;
        }

        .logo-text {
            font-size: 1rem;
            font-weight: 600;
        }

        .logo-sub {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #334155;
            margin-bottom: 1.5rem;
        }

        .auth-tab {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: #64748b;
            padding: 0.65rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }

            .auth-tab.active {
                color: #a78bfa;
                border-bottom-color: #a78bfa;
            }

            .auth-tab:hover {
                color: #f1f5f9;
            }

        .auth-panel {
            display: none;
        }

            .auth-panel.active {
                display: block;
            }

        .msg {
            display: none;
            border-radius: 8px;
            padding: 0.6rem 0.85rem;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .msg-error {
            background: rgba(248,113,113,0.1);
            border: 1px solid rgba(248,113,113,0.3);
            color: #f87171;
        }

        .msg-success {
            background: rgba(52,211,153,0.1);
            border: 1px solid rgba(52,211,153,0.3);
            color: #34d399;
        }

        .field {
            margin-bottom: 1rem;
        }

            .field label {
                display: block;
                font-size: 0.78rem;
                color: #94a3b8;
                margin-bottom: 0.4rem;
            }

            .field input {
                width: 100%;
                background: #0f172a;
                border: 1px solid #334155;
                color: #f1f5f9;
                border-radius: 8px;
                padding: 0.6rem 0.85rem;
                font-size: 0.9rem;
                transition: border-color 0.15s;
            }

                .field input:focus {
                    outline: none;
                    border-color: #a78bfa;
                }

                .field input::placeholder {
                    color: #475569;
                }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 0.7rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

        .btn-purple {
            background: #a78bfa;
            color: #0f172a;
        }

            .btn-purple:hover:not(:disabled) {
                background: #c4b5fd;
            }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.25rem 0;
            color: #475569;
            font-size: 0.75rem;
        }

            .divider::before,
            .divider::after {
                content: '';
                flex: 1;
                height: 1px;
                background: #334155;
            }

        .btn-google {
            width: 100%;
            background: #fff;
            color: #1f2937;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 0.65rem;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: background 0.15s;
        }

            .btn-google:hover {
                background: #f9fafb;
            }

            .btn-google svg {
                width: 18px;
                height: 18px;
                flex-shrink: 0;
            }
    </style>
</head>
<body>

    <script src="/js/shared.js"></script>
    <script>
        // Redirect if already logged in
        (function () {
            const payload = PortalUtils.parseJwt(PortalUtils.getToken());
            if (payload && PortalUtils.isTokenAlive(payload)) {
                window.location.href = '/portal/index.html';
            }
        })();
    </script>

    <div class="wrapper">
        <div class="card">
            <div class="logo">
                <div class="logo-icon">&#9670;</div>
                <div>
                    <div class="logo-text">Vehicle Portal</div>
                    <div class="logo-sub">Buy and sell vehicles</div>
                </div>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Sign in</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Create account</button>
            </div>

            <!-- Login panel -->
            <div id="panel-login" class="auth-panel active">
                <div id="login-error" class="msg msg-error"></div>

                <div class="field">
                    <label>Email address</label>
                    <input type="email" id="login-email" placeholder="you@example.com"
                           autocomplete="username">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••"
                           autocomplete="current-password"
                           onkeydown="if(event.key==='Enter') handleLogin()">
                </div>

                <button id="login-btn" class="btn btn-purple" onclick="handleLogin()">
                    Sign in
                </button>

                <div class="divider">or</div>

                <button class="btn-google" onclick="handleGoogleButton()">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05" />
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
                    </svg>
                    Continue with Google
                </button>
            </div>

            <!-- Register panel -->
            <div id="panel-register" class="auth-panel">
                <div id="register-error" class="msg msg-error"></div>
                <div id="register-success" class="msg msg-success"></div>

                <div class="grid-2">
                    <div class="field">
                        <label>First name</label>
                        <input type="text" id="reg-firstname" placeholder="Jane">
                    </div>
                    <div class="field">
                        <label>Last name</label>
                        <input type="text" id="reg-lastname" placeholder="Doe">
                    </div>
                </div>

                <div class="field">
                    <label>Email address</label>
                    <input type="email" id="reg-email" placeholder="you@example.com"
                           autocomplete="username">
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="reg-password"
                           placeholder="Min 8 chars, 1 upper, 1 symbol"
                           autocomplete="new-password"
                           onkeydown="if(event.key==='Enter') handleRegister()">
                </div>

                <button id="register-btn" class="btn btn-purple" onclick="handleRegister()">
                    Create account
                </button>

                <div class="divider">or</div>

                <button class="btn-google" onclick="handleGoogleButton()">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05" />
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
                    </svg>
                    Continue with Google
                </button>
            </div>
        </div>
    </div>

    <script>
        // ── Load Google One Tap after getting client ID from config ───────────────
        fetch('/api/portal/config')
            .then(r => r.json())
            .then(data => {
                if (!data?.googleClientId) return;

                // Set client ID on existing div
                const existing = document.getElementById('g_id_onload');
                if (existing) existing.remove();

                const div = document.createElement('div');
                div.id = 'g_id_onload';
                div.setAttribute('data-client_id', data.googleClientId);
                div.setAttribute('data-callback', 'handleGoogleOneTap');
                div.setAttribute('data-auto_prompt', 'true');
                document.body.appendChild(div);

                // Load Google script after div is ready
                const script = document.createElement('script');
                script.src = 'https://accounts.google.com/gsi/client';
                script.async = true;
                script.defer = true;
                document.body.appendChild(script);
            })
            .catch(() => console.log('[Portal] Google config not available'));

        // ── Tab switching ─────────────────────────────────────────────────────────
        function switchAuthTab(name) {
            document.querySelectorAll('.auth-tab').forEach((b, i) => {
                b.classList.toggle('active', ['login', 'register'][i] === name);
            });
            document.querySelectorAll('.auth-panel').forEach(p => {
                p.classList.toggle('active', p.id === `panel-${name}`);
            });
        }

        // ── Email/password login ──────────────────────────────────────────────────
        async function handleLogin() {
            clearMsg('login-error');
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            if (!email || !password) {
                showMsg('login-error', 'Please enter your email and password.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in…';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showMsg('login-error', data.message || 'Invalid email or password.');
                    return;
                }

                onAuthSuccess(data.token, data.user);

            } catch {
                showMsg('login-error', 'Could not reach the server. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        }

        // ── Registration ──────────────────────────────────────────────────────────
        async function handleRegister() {
            clearMsg('register-error');
            clearMsg('register-success');

            const firstName = document.getElementById('reg-firstname').value.trim();
            const lastName = document.getElementById('reg-lastname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const btn = document.getElementById('register-btn');

            if (!email || !password) {
                showMsg('register-error', 'Email and password are required.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account…';

            try {
                const res = await fetch('/api/portal/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ firstName, lastName, email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showMsg('register-error', data.message || 'Registration failed.');
                    return;
                }

                onAuthSuccess(data.token, data.user);

            } catch {
                showMsg('register-error', 'Could not reach the server. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create account';
            }
        }

        // ── Google One Tap callback ───────────────────────────────────────────────
        async function handleGoogleOneTap(response) {
            try {
                const res = await fetch('/api/portal/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: response.credential })
                });

                const data = await res.json();

                if (!res.ok) {
                    showMsg('login-error', data.message || 'Google sign-in failed.');
                    return;
                }

                onAuthSuccess(data.token, data.user);

            } catch {
                showMsg('login-error', 'Google sign-in failed. Please try again.');
            }
        }

        // ── Google button click ───────────────────────────────────────────────────
        function handleGoogleButton() {
            if (window.google?.accounts?.id) {
                window.google.accounts.id.prompt();
            } else {
                showMsg('login-error',
                    'Google sign-in is not available. Please use email and password.');
            }
        }

        // ── On successful auth ────────────────────────────────────────────────────
        function onAuthSuccess(token, user) {
            PortalUtils.saveToken(token);
            PortalUtils.saveUser(user);
            window.location.href = '/portal/index.html';
        }

        // ── Message helpers ───────────────────────────────────────────────────────
        function showMsg(id, text) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.style.display = 'block';
        }

        function clearMsg(id) {
            const el = document.getElementById(id);
            el.style.display = 'none';
            el.textContent = '';
        }
    </script>
</body>
</html>
